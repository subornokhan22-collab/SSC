name: tutors_desk
description: "Tutor's Desk - SSC 2027 question-paper studio for tutors"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  pdf: ^3.11.0
  printing: ^5.15.0
  # ইমেইল OTP লগইন + Pro সিংক (Supabase)
  supabase_flutter: ^2.8.0
  # OMR scanner + question-paper library
  image_picker: ^1.1.0   # OMR শিট / প্রশ্নপত্রের ফটো (ক্যামেরা + গ্যালারি)
  camera: ^0.12.1        # লাইভ ক্যামেরা প্রিভিউ + গাইডেড অটো-ক্যাপচার (OMR)
  google_mlkit_document_scanner: ^0.6.1  # Google ডকুমেন্ট স্ক্যানার — শিট শনাক্ত/অটো-ক্যাপচার (ML Kit)
  image: ^4.2.0          # pure-Dart image processing (OMR bubble reading)
  file_picker: ^8.1.2    # PDF প্রশ্নপত্র যোগ করা
  path_provider: ^2.1.0  # যোগ করা প্রশ্নপত্র ডিভাইসে সংরক্ষণ
  connectivity_plus: ^6.0.0  # offline detection (global banner + app-open error)
  url_launcher: ^6.3.0       # open the bKash checkout (bKash payment flow)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/questions/
    - assets/question_figures/
    - assets/icon/icon.png
    - assets/icon/icon_foreground.png
    - assets/fonts/NotoSerifBengali-Regular.ttf
    - assets/fonts/NotoSerifBengali-Bold.ttf
    - assets/fonts/HindSiliguri-Regular.ttf
    - assets/fonts/DejaVuSans.ttf
    - assets/fonts/DejaVuSans-Bold.ttf

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0A2A80"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
