name: mentors_companion
description: "Mentor's Companion - SSC 2027 question-paper studio for tutors"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  webview_flutter: ^4.7.0
  shared_preferences: ^2.2.2
  pdf: ^3.11.0
  printing: ^5.15.0
  # ইমেইল OTP লগইন + Pro সিংক (Supabase)
  supabase_flutter: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
    - assets/icon/icon_foreground.png
    - assets/fonts/

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0D4782"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
