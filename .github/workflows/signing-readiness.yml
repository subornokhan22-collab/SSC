name: Signing readiness diagnostics (one-off)

# Answers two questions that cannot be answered from a workstation without the
# Android SDK and Java:
#   1. Can Java 17 read a PKCS12 keystore produced by OpenSSL 3 with the
#      PBE-SHA1-3DES schemes? (A throwaway key is used; no real key is touched.)
#   2. Which key signed the APK already installed on the owner's phone, and can
#      another CI build produce that same key? This decides whether the saved
#      paper library can be migrated in place or must be exported first.
#
# Nothing here is distributed and no signing material leaves this workflow.

on:
  workflow_dispatch:
  push:
    branches: [arena/01a0ce12-ssc]
    paths:
      - '.github/workflows/signing-readiness.yml'

permissions:
  contents: read
  actions: read

jobs:
  keystore-format:
    name: Java can read the OpenSSL PKCS12 format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create a throwaway keystore with the same OpenSSL flags
        run: |
          set -eu
          openssl req -x509 -newkey rsa:2048 -sha256 -days 10000 -nodes \
            -keyout probe-key.pem -out probe-cert.pem \
            -subj "/CN=Format Probe/O=Tutors Desk/OU=Mobile/C=BD" \
            -addext "basicConstraints=critical,CA:FALSE" \
            -addext "keyUsage=critical,digitalSignature,keyEncipherment" 2>/dev/null
          openssl pkcs12 -export -inkey probe-key.pem -in probe-cert.pem \
            -name tutors-desk -out probe.p12 -passout pass:probe-password \
            -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1
          rm -f probe-key.pem probe-cert.pem
          ls -l probe.p12

      - name: Load it exactly the way validateProductionSigning does
        run: |
          set -eu
          cat > StoreCheck.java <<'JAVA'
          import java.io.FileInputStream;
          import java.io.InputStream;
          import java.security.KeyStore;
          import java.security.MessageDigest;
          import java.security.PrivateKey;
          import java.security.cert.X509Certificate;

          public class StoreCheck {
            public static void main(String[] args) throws Exception {
              KeyStore ks = KeyStore.getInstance("PKCS12");
              try (InputStream in = new FileInputStream(args[0])) {
                ks.load(in, args[1].toCharArray());
              }
              String alias = "tutors-desk";
              System.out.println("containsAlias=" + ks.containsAlias(alias));
              System.out.println("isKeyEntry=" + ks.isKeyEntry(alias));
              System.out.println("privateKeyReadable="
                  + (ks.getKey(alias, args[2].toCharArray()) instanceof PrivateKey));
              X509Certificate cert = (X509Certificate) ks.getCertificate(alias);
              cert.checkValidity();
              System.out.println("subject=" + cert.getSubjectX500Principal().getName());
              System.out.println("notAndroidDebug="
                  + !cert.getSubjectX500Principal().getName().contains("Android Debug"));
              byte[] digest = MessageDigest.getInstance("SHA-256").digest(cert.getEncoded());
              StringBuilder hex = new StringBuilder();
              for (byte b : digest) hex.append(String.format("%02x", b));
              System.out.println("sha256Length=" + hex.length());
            }
          }
          JAVA
          java StoreCheck.java probe.p12 probe-password probe-password

      - name: Confirm keytool agrees
        run: keytool -list -keystore probe.p12 -storetype PKCS12 -storepass probe-password

      - name: Verdict
        run: |
          echo '### Java interop verdict' >> "$GITHUB_STEP_SUMMARY"
          echo 'OpenSSL 3 PKCS12 with PBE-SHA1-3DES + SHA-1 MAC loads under Java 17 with' >> "$GITHUB_STEP_SUMMARY"
          echo 'KeyStore.getInstance("PKCS12"), exposes alias `tutors-desk`, its private key and a' >> "$GITHUB_STEP_SUMMARY"
          echo 'valid non-debug certificate. This is the format the owner was given.' >> "$GITHUB_STEP_SUMMARY"

  installed-apk-key:
    name: Identify the key that signed the installed APK
    runs-on: ubuntu-latest
    steps:
      - name: Record the debug keystore state BEFORE any build tool runs
        run: |
          if [ -f "$HOME/.android/debug.keystore" ]; then
            echo 'This runner image already contains ~/.android/debug.keystore:'
            keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android 2>/dev/null \
              | sed -n 's/^SHA256: //p' | head -1 | sed 's/^/runner debug SHA-256: /'
            echo 'PREBAKED=yes' >> "$GITHUB_ENV"
          else
            echo 'This runner has NO pre-existing ~/.android/debug.keystore.'
            echo 'That means every CI run that needs a debug key generates a fresh random one.'
            echo 'PREBAKED=no' >> "$GITHUB_ENV"
          fi

      - name: Download the APK the owner has installed (build 347)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          curl -sSL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/10897601043/zip" \
            -o installed.zip
          test -s installed.zip
          mkdir -p installed && (cd installed && unzip -o -q ../installed.zip)
          find installed -name '*.apk' -print

      - name: Print that APK's signing certificate
        run: |
          set -eu
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          apk=$(find installed -name '*.apk' | head -1)
          "$signer" verify --verbose --print-certs "$apk" > installed-certs.txt
          sed -n 's/^Signer #1 certificate SHA-256 digest: /installed SHA-256: /p' installed-certs.txt
          grep -qi 'Android Debug' installed-certs.txt \
            && echo 'installed identity: Android Debug certificate' \
            || echo 'installed identity: not the Android debug certificate'

      - name: Verdict on migrating the saved papers
        run: |
          {
            echo '### Installed-APK signing verdict'
            echo
            if [ "$PREBAKED" = "yes" ]; then
              echo 'The runner image ships a debug keystore, so compare the two fingerprints above.'
              echo 'If they match, a debug-signed build from this branch installs over the current'
              echo 'app without uninstalling, which would let the owner export the paper library first.'
            else
              echo 'The runner image does **not** ship a debug keystore, so the key that signed the'
              echo 'installed build existed only on the runner that built it and is gone.'
              echo 'No future CI build can reproduce that signature, therefore **no new APK can be'
              echo 'installed over the current one**: one uninstall is unavoidable, and the paper'
              echo 'library stored in app-private storage is deleted with it.'
              echo
              echo 'The installed build (4b535e7) writes its auto-backup only to app-private storage'
              echo 'and has no Dart caller for copyToDownloads, so it cannot export the library'
              echo 'anywhere that survives that uninstall.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
