name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get packages
        run: flutter pub get

      - name: Generate launcher icons (fixes missing app icon)
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi 2>&1 | tee build.log || {
            echo "::error title=APK build failed (last lines)::$(tail -n 60 build.log | tr '\n' ' ' | head -c 4000)"
            tail -n 60 build.log
            exit 1
          }

      - name: Upload APK to Releases (no storage quota!)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "apk-${{ github.run_id }}" \
            build/app/outputs/flutter-apk/app-*-release.apk \
            --repo "${{ github.repository }}" \
            --title "Tutor's Desk (build ${{ github.run_number }})" \
            --notes "Tutor's Desk. Most phones need app-arm64-v8a-release.apk." \
            --latest
