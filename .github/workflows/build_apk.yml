name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  security-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: rls_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rls_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Gemini edge function
        run: deno check supabase/functions/mimi/index.ts
      - name: Gateway request boundary tests
        run: node --experimental-strip-types --test supabase/tests/*_test.mjs
      - name: Profiles RLS and audit regression tests (disposable database)
        env:
          PGPASSWORD: ci-only-password
        run: psql -h 127.0.0.1 -U postgres -d rls_test -v ON_ERROR_STOP=1 -f supabase/tests/profiles_rls_test.sql

  build:
    needs: security-tests
    runs-on: ubuntu-latest
    # The `secrets` context is not allowed inside step `if:` conditions,
    # so the "does the keystore exist" check is staged through env here.
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get packages
        run: flutter pub get

      # Opt-in mechanical formatting for this Arena branch (no force push).
      # Needed because the editor sandbox has no Flutter/Dart SDK.
      - name: Format sources on request
        if: github.ref == 'refs/heads/arena/01a0ce12-ssc' && contains(github.event.head_commit.message, '[format]')
        run: |
          set -o pipefail
          if ! dart format lib test tool 2>&1 | tee format.log; then
            python3 tool/ci_annotations.py format.log
            exit 1
          fi
          if ! git diff --quiet -- lib test tool; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib test tool
            git commit -m "Format Dart sources for the teacher workflow quality gate"
            git push origin HEAD:arena/01a0ce12-ssc
          fi

      - name: Analyze (quality gate — blocks on Dart errors)
        # --no-fatal-warnings: existing warnings (unused vars, deprecated
        # withOpacity) must not block builds; real errors still fail it.
        run: |
          set -o pipefail
          if ! flutter analyze --no-fatal-warnings --no-fatal-infos 2>&1 | tee analyze.log; then
            python3 tool/ci_annotations.py analyze.log
            exit 1
          fi

      - name: Test (quality gate — blocks on failing tests)
        run: |
          set -o pipefail
          if ! flutter test --reporter expanded 2>&1 | tee test.log; then
            python3 tool/ci_annotations.py test.log
            exit 1
          fi

      - name: Format check (quality gate)
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Question bank health (review item #35)
        # Warnings (duplicate stems etc.) are reported but do not block;
        # hard problems (bad keys, dup ids, empty options) fail the build.
        run: |
          set -o pipefail
          python3 tool/bank_health.py | tee bank-health.txt

      - name: Upload bank health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bank-health
          path: bank-health.txt
          retention-days: 30

      - name: Restore release keystore (from GitHub Secrets)
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          ls -la android/app/release.keystore

      - name: Generate launcher icons (fixes missing app icon)
        run: dart run flutter_launcher_icons

      - name: Build APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi --dart-define=BUILD_NUMBER=${{ github.run_number }} 2>&1 | tee flutter-build.log

      - name: Post build log (diagnostic — as artifact, not release)
        if: failure()
        run: |
          {
            echo "===== ANALYZE ====="
            tail -c 30000 analyze.log 2>/dev/null || echo "(no analyze.log)"
            echo ""
            echo "===== TEST ====="
            tail -c 30000 test.log 2>/dev/null || echo "(no test.log)"
            echo ""
            echo "===== BUILD ====="
            tail -c 30000 flutter-build.log 2>/dev/null || echo "(no flutter-build.log)"
          } > ci-diag-${GITHUB_RUN_ID}.txt

      - name: Upload diagnostic log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diag-${{ github.run_id }}
          path: ci-diag-${{ github.run_id }}.txt
          retention-days: 30

      # Review item #32: a release is a release. Branch builds upload an
      # Actions artifact (Actions → run → Artifacts → download); a formal
      # GitHub Release is only created from a version tag (git tag v1.0.0
      # && git push origin v1.0.0) so the release list stops accumulating
      # a build per push.
      - name: Upload APK as artifact (branch build)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          # mapping.txt (R8 symbol map) rides along so any minified-crash
          # stack can be decoded against this exact build.
          name: tutor-desk-apk-build-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-*-release.apk
            build/app/outputs/mapping/release/mapping.txt
          retention-days: 30

      - name: Publish GitHub Release (version tags only)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            build/app/outputs/flutter-apk/app-*-release.apk \
            build/app/outputs/mapping/release/mapping.txt \
            --repo "${{ github.repository }}" \
            --title "Tutor's Desk ${GITHUB_REF_NAME} (build ${{ github.run_number }})" \
            --notes "Tutor's Desk ${GITHUB_REF_NAME}. Most phones need app-arm64-v8a-release.apk." \
            --latest
