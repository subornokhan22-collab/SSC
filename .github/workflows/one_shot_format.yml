name: One-shot Dart formatter

on:
  push:
    branches: [arena/01a0ce12-ssc]
    paths: [.github/workflows/one_shot_format.yml]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0ce12-ssc
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true
      - run: dart format lib test
      - run: |
          rm .github/workflows/one_shot_format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test .github/workflows/one_shot_format.yml
          git commit -m "style: format SVG icon integration"
          git push origin HEAD:arena/01a0ce12-ssc
